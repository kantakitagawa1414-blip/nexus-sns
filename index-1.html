<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>NEXUS | つながる体験</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f7ff;font-family:system-ui,sans-serif}header{padding:22px 18px;background:#151c33;position:sticky;top:0}h1{margin:0;font-size:25px;letter-spacing:2px}small,.muted{color:#aab5cf}main{max-width:680px;margin:auto;padding:18px}.card{background:#18213a;border:1px solid #303c5a;border-radius:16px;padding:17px;margin-bottom:16px}input,textarea,select{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #53617c;background:#0e162a;color:white;font:inherit}textarea{min-height:95px}button{border:0;border-radius:10px;background:#7768f6;color:white;padding:11px 16px;font-weight:700;cursor:pointer}button.secondary{background:#33415e}nav{display:flex;gap:8px;margin:14px 0}nav button{flex:1}nav button.active{background:#7768f6}.hidden{display:none}.post{white-space:pre-wrap;overflow-wrap:anywhere}.meta{color:#b0bbd3;font-size:12px;margin-bottom:10px}.count{color:#b0bbd3;font-size:13px}h2{font-size:19px;margin-top:0}</style></head><body><header><h1>✦ NEXUS</h1><small>見るだけじゃない。一緒に体験するSNS。</small></header><main><div class="card"><label>表示名<input id="name" maxlength="24" placeholder="あなたの名前"></label><button onclick="saveName()">名前を保存</button><p class="muted" id="hello"></p></div><nav><button id="tab-posts" class="active" onclick="showTab('posts')">投稿</button><button id="tab-now" class="secondary" onclick="showTab('now')">NOW</button></nav><section id="posts"><div class="card"><h2>新しい投稿</h2><textarea id="postText" maxlength="500" placeholder="今、何を考えている？"></textarea><button onclick="addPost()">投稿する</button></div><div id="postList"></div></section><section id="now" class="hidden"><div class="card"><h2>一緒に何かを始めよう</h2><input id="roomTitle" maxlength="70" placeholder="例：今から30分英語を勉強しよう"><select id="roomCategory"><option>勉強</option><option>雑談</option><option>ゲーム</option><option>創作</option><option>その他</option></select><button onclick="addRoom()">NOWルームを作る</button></div><div id="roomList"></div></section><p class="muted">試作品 v0.1：データはこのブラウザ内にのみ保存されます。他の利用者には共有されません。</p></main><script>const KEY='nexus-demo-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{name:'',posts:[],rooms:[]}}catch(e){data={name:'',posts:[],rooms:[]}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}function showTab(t){for(let k of ['posts','now']){document.getElementById(k).classList.toggle('hidden',k!==t);document.getElementById('tab-'+k).className=k===t?'active':'secondary'}}function saveName(){data.name=document.getElementById('name').value.trim().slice(0,24)||'ゲスト';save();render()}function addPost(){let text=document.getElementById('postText').value.trim();if(!text)return alert('投稿内容を入力してください');data.posts.unshift({id:Date.now(),name:data.name||'ゲスト',text,likes:0,liked:false,time:new Date().toLocaleString('ja-JP')});document.getElementById('postText').value='';save();render()}function addRoom(){let title=document.getElementById('roomTitle').value.trim();if(!title)return alert('ルーム名を入力してください');data.rooms.unshift({id:Date.now(),name:data.name||'ゲスト',title,category:document.getElementById('roomCategory').value,joined:false});document.getElementById('roomTitle').value='';save();render()}function render(){document.getElementById('name').value=data.name;document.getElementById('hello').textContent=data.name?'こんにちは、'+data.name+'さん':'';let p=document.getElementById('postList');p.replaceChildren();if(!data.posts.length)p.append(el('p','muted','まだ投稿はありません。最初の投稿をしてみましょう。'));for(let post of data.posts){let c=el('article','card');c.append(el('div','meta',post.name+' · '+post.time),el('p','post',post.text));let b=el('button','secondary',(post.liked?'♥':'♡')+' '+post.likes);b.onclick=()=>{post.likes+=post.liked?-1:1;post.liked=!post.liked;save();render()};c.append(b);p.append(c)}let r=document.getElementById('roomList');r.replaceChildren();if(!data.rooms.length)r.append(el('p','muted','まだルームはありません。最初のルームを作ってみましょう。'));for(let room of data.rooms){let c=el('article','card');c.append(el('div','meta',room.category+' · 作成者 '+room.name),el('h2','',room.title));let b=el('button','secondary',room.joined?'✓ 参加中':'参加する');b.onclick=()=>{room.joined=!room.joined;save();render()};c.append(b);r.append(c)}}render();</script></body></html>
