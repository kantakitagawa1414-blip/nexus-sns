<!doctype html>

<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS | 一緒に体験するSNS</title><style>  
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0c1022;color:#f4f5ff}header{background:#171d37;padding:22px max(18px,calc((100% - 700px)/2));border-bottom:1px solid #303955}h1{margin:0;font-size:29px;letter-spacing:2px}header p{margin:4px 0;color:#aeb8d3;font-size:13px}main{max-width:700px;margin:auto;padding:20px 16px}.panel{background:#1b2340;border:1px solid #354064;border-radius:20px;padding:20px;margin-bottom:16px}h2{font-size:19px;margin:0 0 16px}input,textarea{display:block;width:100%;background:#0e152b;border:1px solid #485478;border-radius:12px;padding:14px;color:white;font:inherit;margin:10px 0}textarea{min-height:115px;resize:vertical}button{border:0;border-radius:11px;background:#7666f6;color:white;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer}button.secondary{background:#354464}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;flex-wrap:wrap;gap:8px}.muted{color:#b1bbd5;font-size:13px}.error{color:#ffaaa9;white-space:pre-wrap}.success{color:#a2efcf;white-space:pre-wrap}.post{padding:18px 0;border-bottom:1px solid #36405e}.post:last-child{border:0}.post strong{color:#c9c1ff}.post time{color:#a5afca;font-size:12px;margin-left:8px}.post p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.hidden{display:none!important}#notice{margin:10px 0}.topbar{display:flex;justify-content:space-between;gap:8px;align-items:center}#userLabel{overflow-wrap:anywhere;font-size:13px;color:#c5cde1}button.small{font-size:13px;padding:8px 12px}  
</style></head><body><header><h1>✦ NEXUS</h1><p>見るだけじゃない。一緒に体験するSNS。</p></header><main><section class="panel" id="setup"><h2>初期設定</h2><p class="muted">SupabaseのProject URLとPublishable keyを設定してください。Secret keyは絶対に入力しないでください。</p><input id="projectUrl" placeholder="https://xxxxx.supabase.co"><input id="publishable" placeholder="sb_publishable_..."><button id="connect">接続する</button></section><div id="notice" role="status"></div><section id="auth" class="panel hidden"><h2>ログイン・新規登録</h2><input id="email" type="email" autocomplete="email" placeholder="メールアドレス"><input id="password" type="password" autocomplete="current-password" placeholder="パスワード（6文字以上）"><div class="actions"><button id="signIn">ログイン</button><button id="signUp" class="secondary">新規登録</button></div><p class="muted">メール確認が有効な場合は、登録後に届くメール内のリンクを開いてください。</p></section><section id="app" class="hidden"><div class="panel"><div class="topbar"><span id="userLabel"></span><button class="secondary small" id="signOut">ログアウト</button></div><h2 style="margin-top:18px">プロフィール</h2><input id="displayName" maxlength="40" placeholder="表示名">

<input id="username" maxlength="20"
placeholder="ユーザー名（例：nexus）">

<textarea id="bio" maxlength="160"
placeholder="自己紹介（160文字以内）"></textarea>

<input id="avatarUrl" type="url"
placeholder="プロフィール画像URL（https://...）">

<button id="saveName">プロフィールを保存</button></div><div class="panel"><h2>新しい投稿</h2><textarea id="content" maxlength="1000" placeholder="今、何を考えている？"></textarea><div class="topbar"><span class="muted" id="count">0 / 1000</span><button id="publish">投稿する</button></div></div><section class="panel"><div class="topbar"><h2>タイムライン</h2><button id="refresh" class="secondary small">更新</button></div><div id="feed" class="muted">読み込み中...</div></section></section></main><script type="module">  
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';  
const $=id=>document.getElementById(id), show=(id,yes)=>$(id).classList.toggle('hidden',!yes);  
const msg=(text,error=false)=>{const n=$('notice');n.textContent=text;n.className=error?'error':'success'};  
let client=null,session=null;const storageKey='nexus_supabase_config';  
function validConfig(url,key){try{const u=new URL(url);return u.protocol==='https:'&&u.hostname.endsWith('.supabase.co')&&key.startsWith('sb_publishable_')}catch{return false}}  
async function init(url,key){if(!validConfig(url,key)){msg('Project URL または Publishable key の形式が正しくありません。',true);return}try{client=createClient(url,key);localStorage.setItem(storageKey,JSON.stringify({url,key}));show('setup',false);show('auth',true);const {data:{session:s},error}=await client.auth.getSession();if(error)throw error;await setSession(s);client.auth.onAuthStateChange((_event,s)=>{setTimeout(()=>setSession(s),0)});msg('Supabaseに接続しました。')}catch(e){msg(e.message,true);show('setup',true)}}  
async function setSession(s){session=s;show('auth',!s);show('app',!!s);if(!s)return;$('userLabel').textContent=s.user.email||'ログイン中';await Promise.all([loadProfile(),loadFeed()])}  
async function loadProfile() {
  if (!session) return;

  const {data, error} = await client
    .from('profiles')
    .select('display_name,username,bio,avatar_url')
    .eq('id', session.user.id)
    .maybeSingle();

  if (error) {
    msg('プロフィール取得エラー: ' + error.message, true);
    return;
  }

  $('displayName').value = data?.display_name || '';
  $('username').value = data?.username || '';
  $('bio').value = data?.bio || '';
  $('avatarUrl').value = data?.avatar_url || '';
}  
async function loadFeed(){if(!session)return;const feed=$('feed');feed.textContent='読み込み中...';const {data,error}=await client.from('posts').select('id,content,created_at,user_id').order('created_at',{ascending:false}).limit(50);if(error){feed.textContent='投稿の取得に失敗: '+error.message;return}feed.replaceChildren();if(!data?.length){feed.textContent='まだ投稿はありません。最初の投稿をしてみましょう。';return}const ids=[...new Set(data.map(p=>p.user_id))];const {data:profiles,error:pe}=await client.from('profiles').select('id,display_name').in('id',ids);if(pe){msg('表示名の取得に失敗: '+pe.message,true)}const names=new Map((profiles||[]).map(p=>[p.id,p.display_name]));for(const p of data){const article=document.createElement('article');article.className='post';const name=document.createElement('strong');name.textContent=names.get(p.user_id)||'ユーザー';const date=document.createElement('time');date.textContent=new Date(p.created_at).toLocaleString('ja-JP');const body=document.createElement('p');body.textContent=p.content;article.append(name,date,body);feed.append(article)}}  
$('connect').onclick=()=>init($('projectUrl').value.trim(),$('publishable').value.trim());  
$('signUp').onclick=async()=>{if(!client)return;const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){msg('メールアドレスと6文字以上のパスワードを入力してください。',true);return}const {data,error}=await client.auth.signUp({email,password});msg(error?error.message:data.session?'登録してログインしました。':'登録を受け付けました。確認メールが届いた場合は認証してください。',!!error)};  
$('signIn').onclick=async()=>{const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});msg(error?error.message:'ログインしました。',!!error)};  
$('signOut').onclick=async()=>{const {error}=await client.auth.signOut();msg(error?error.message:'ログアウトしました。',!!error)};  
$('saveName').onclick = async () => {
  if (!session) return;

  const name = $('displayName').value.trim();
  const username = $('username').value.trim().toLowerCase();
  const bio = $('bio').value.trim();
  const avatarUrl = $('avatarUrl').value.trim();

  if (!name) {
    msg('表示名を入力してください。', true);
    return;
  }

  if (username && !/^[a-z0-9_]{3,20}$/.test(username)) {
    msg('ユーザー名は英小文字・数字・_ の3〜20文字にしてください。', true);
    return;
  }

  if (avatarUrl) {
    try {
      const url = new URL(avatarUrl);
      if (url.protocol !== 'https:') throw new Error();
    } catch {
      msg('画像URLは有効なhttps://のURLにしてください。', true);
      return;
    }
  }

  const btn = $('saveName');
  btn.disabled = true;

  try {
    const {error} = await client.from('profiles').upsert({
      id: session.user.id,
      display_name: name,
      username: username || null,
      bio: bio,
      avatar_url: avatarUrl || null
    }, {onConflict: 'id'});

    if (error) throw error;

    msg('プロフィールを保存しました。');
    await loadProfile();
    await loadFeed();
  } catch (e) {
    msg('プロフィール保存エラー: ' + e.message, true);
  } finally {
    btn.disabled = false;
  }
};
$('content').oninput=()=>{$('count').textContent=$('content').value.length+' / 1000'};  
$('publish').onclick=async()=>{if(!session)return;const content=$('content').value.trim();if(!content){msg('投稿内容を入力してください。',true);return}if(content.length>1000){msg('1000文字以内にしてください。',true);return}const btn=$('publish');btn.disabled=true;try{const {error}=await client.from('posts').insert({user_id:session.user.id,content});if(error)throw error;$('content').value='';$('count').textContent='0 / 1000';msg('投稿しました。');await loadFeed()}catch(e){msg('投稿に失敗: '+e.message,true)}finally{btn.disabled=false}};  
$('refresh').onclick=loadFeed;  
try{const cfg=JSON.parse(localStorage.getItem(storageKey)||'null');if(cfg?.url&&cfg?.key){$('projectUrl').value=cfg.url;$('publishable').value=cfg.key;await init(cfg.url,cfg.key)}}catch{}  
</script></body></html>
